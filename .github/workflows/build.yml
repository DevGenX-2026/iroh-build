name: Build iroh-ffi for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iroh-ffi
        uses: actions/checkout@v4
        with:
          repository: n0-computer/iroh-ffi
          ref: main
          path: iroh-ffi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build .so for all ABIs
        working-directory: iroh-ffi
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../jniLibs build --release --locked --lib

      - name: Generate Kotlin bindings
        working-directory: iroh-ffi
        run: |
          cargo install uniffi-bindgen-cli --locked || true
          UDL_FILE=$(find . -name "*.udl" | head -n 1)
          if [ -n "$UDL_FILE" ]; then
            uniffi-bindgen generate "$UDL_FILE" --language kotlin --out-dir ../kotlin-bindings
          fi

      - name: Package artifact
        run: |
          mkdir -p package/jniLibs package/kotlin
          cp -r jniLibs/* package/jniLibs/ 2>/dev/null || true
          cp -r kotlin-bindings/* package/kotlin/ 2>/dev/null || true
          cd package && zip -r ../iroh-android.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iroh-android-build
          path: iroh-android.zip
